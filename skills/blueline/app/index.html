<style>
/* v3: the slide fills the screen, one comment at a time. Scroll down for the next comment.
   The sidebar holds that comment, Claude's change, Edit / Not quite, and the approve panel at the bottom. */
/* Dark only, in the style of a portfolio "feedback mode": black canvas in a rounded window,
   a flat grey comments panel, one blue for links and focus; blue dashes only for what changed on the slide. One sans throughout. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
h1, h2, h3, p { margin: 0; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; border-radius: 3px; }
/* ---------- frame ---------- */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.top h1 { font-size: 15px; font-weight: 700; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 span { font-weight: 400; color: var(--slate); }
.top .pos { font-size: 14px; color: var(--slate); white-space: nowrap; }
.top .pos b { color: var(--ink); }
@media (max-width: 1100px) { .hint-keys { display: none; } }
/* ---------- canvas: the slides ---------- */
.scroller { overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: no-preference) { .scroller { scroll-behavior: smooth; } }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.stage .now { opacity: 0; }
/* The state label sits above the slide, so nothing covers the slide itself */
.stage.is-now .now { opacity: 1; }
.stage.still { cursor: default; }
@media (prefers-reduced-motion: no-preference) { .stage .now { transition: opacity .14s ease; } }
.cap .r { margin-left: auto; }
.thumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.thumb { padding: 0; border: 0; background: none; cursor: pointer; display: grid; gap: 3px; width: 96px; text-align: left; font-size: 12px; color: var(--slate); }
.thumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 3px; box-shadow: 0 0 0 1px var(--edge); display: block; background: #fff; }
.thumb[aria-pressed="true"] img { box-shadow: 0 0 0 2px var(--pencil); }
.thumb[aria-pressed="true"] { color: var(--pencil); font-weight: 700; }
.more { font-size: 13px; color: var(--slate); }
.six { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.six figure { margin: 0; display: grid; gap: 4px; }
.six img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; display: block; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 6px 18px rgba(0, 0, 0, .1); }
.six figcaption { font-size: 13px; color: var(--slate); }
.six figcaption b { color: var(--ink); }
.six .cut img, .six .fold img { opacity: .3; filter: grayscale(1); }
.six .plus img { box-shadow: 0 0 0 3px var(--pencil); }
.six .plus figcaption span { color: var(--pencil); font-weight: 700; }
/* ---------- strip: one thumbnail per comment ---------- */
.chip:hover img { opacity: 1; }
.chip[aria-current="true"] img { opacity: 1; box-shadow: 0 0 0 2px var(--pencil); }
.chip[aria-current="true"] { color: var(--pencil); font-weight: 700; }
.chip .mk { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
.chip .mk.back { background: var(--pencil); }
.chip .mk.edit { background: #F0B000; }
.chip .mk.skip { background: var(--muted); }
.chip-n { display: inline-flex; align-items: center; gap: 5px; }
.chip[aria-current="true"] .count { background: var(--pencil); color: var(--on-pencil); }
/* ---------- several comments on one slide ---------- */
.cmt { display: grid; gap: 12px; }
/* A comment you're not on: the reviewer's words, then one line saying where it stands. The whole line opens it. */
.cmt-sum { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; font: 400 13px/1.4 var(--sans); color: var(--slate); text-align: left; cursor: pointer; }
.cmt-sum:hover, .cmt-sum:focus-visible { background: rgba(255, 255, 255, .06); color: var(--ink); }
.cmt-sum .what { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cmt-sum .open-hint { margin-left: auto; flex: none; color: var(--pencil-text); font-weight: 500; }
.cmt-sum .ok { color: var(--done); }
.who .span { display: block; font-size: 12px; color: var(--slate); }
.on-slide { font-size: 12px; font-weight: 700; color: var(--pencil); white-space: nowrap; }
.who-row .link { font-size: 12px; white-space: nowrap; }
.also-on { display: grid; gap: 4px; justify-items: start; padding-top: 12px; border-top: 1px solid var(--line); }
.label.quiet { color: var(--slate); }
/* ---------- tap to edit ---------- */
.redline li.tap { cursor: text; }
textarea.inline { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: transparent; color: var(--ink); font: inherit; line-height: 1.5; resize: none; field-sizing: content; outline: none; }
.keys { display: block; margin-top: 4px; font-size: 11px; color: var(--slate); }
/* ---------- feedback-mode look ---------- */
body { margin: 0; color: var(--ink); font: 400 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; background: #1D1D1F; -webkit-font-smoothing: antialiased; }
.app { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: minmax(0, 1fr); }
.canvas { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; position: relative; margin: 12px 0 12px 12px; border-radius: 28px; overflow: hidden; background: var(--canvas); box-shadow: 0 0 0 1px rgba(255, 255, 255, .06); }
.pill { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 20px; padding: 7px 7px 7px 16px; border-radius: 16px; background: rgba(14, 14, 14, .88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(255, 255, 255, .1); white-space: nowrap; font-size: 15px; }
.pill .mark { display: grid; place-items: center; color: var(--ink); }
.pill .mark svg { width: 18px; height: 18px; display: block; }
.pill-title { font-size: 15px; font-weight: 400; }
.pill-pos { color: var(--slate); }
.pill-pos b { color: var(--ink); font-weight: 500; }
.pill-btn { padding: 8px 14px; border-radius: 10px; background: var(--well); box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); color: var(--ink); text-decoration: none; }
.pill-btn:hover { background: var(--well-hover); }
.stop { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; container-type: size; display: grid; place-items: center; padding: 92px 48px 20px; }
.stop-in.grid6 { width: min(calc(100cqw - 96px), calc((100cqh - 214px) * 2.5)); }
.stage .hl { position: absolute; pointer-events: none; border: 1.5px dashed var(--pencil); background: rgba(76, 141, 255, .07); border-radius: 4px; }
.stage.is-now .hl { border-style: dashed; opacity: .35; }
/* Every comment's change on one picture: the one you're on is bright, the others are quieter, and every pin opens its comment */
.stage .hl.off { opacity: .5; background: transparent; }
.stage .hl .hl-who[data-pin] { pointer-events: auto; cursor: pointer; transform: translate(calc(-2px + var(--nudge, 0px)), 2px); }
.stage .hl.on .hl-who { box-shadow: 0 0 0 2px var(--pencil), 0 2px 4px rgba(0, 0, 0, .45), 0 6px 14px rgba(0, 0, 0, .35); }
.stage .hl.off .hl-who:hover { opacity: 1; }
.state { font-size: 13px; font-weight: 500; color: var(--slate); }
.cap { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--slate); font-size: 13px; align-items: center; }
.cap-btn { font: 500 12px var(--sans); color: var(--ink); background: var(--well); border: 0; border-radius: 8px; padding: 4px 10px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); cursor: pointer; }
.cap-btn:hover { background: var(--well-hover); }
.canvas.no-hl .stage .hl { display: none; }
/* You've changed the wording: the picture is Claude's version, so its outlines go grey and the caption says so */
.stage.stale .hl { border-color: var(--slate); background: transparent; }
.cap .stale-note { color: var(--pencil-text); }
/* Before / After: a pill switch above the slide, outlines toggle on the right of the same row */
.stop-in { display: grid; gap: 10px; width: min(calc(100cqw - 96px), calc((100cqh - 112px - var(--extra)) * 16 / 9)); --extra: 84px; }
.stop-in.has-thumbs { --extra: 158px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar .cap-btn { padding: 7px 12px; font-size: 13px; }
.stop-in.is-now .pillsw { --p: 0; }
.pillsw.dragging .knob { transition: none; }
.pillsw button { position: relative; z-index: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 999px; background: none; font: 500 14px var(--sans); color: var(--slate); cursor: pointer; transition: color .25s ease; }
.pillsw button[aria-checked="true"] { color: var(--canvas); }
@media (prefers-reduced-motion: no-preference) { .pillsw .knob { transition: transform .38s cubic-bezier(.3, 1.25, .45, 1); } }
/* Option grid: a labelled tag on each slide that leaves, a plus on each slide that gains */
.six .pic { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 6px; }
.six .pic.zoom { cursor: zoom-in; }
.six .pic.zoom:hover img { box-shadow: 0 0 0 3px var(--pencil), 0 0 0 7px rgba(76, 141, 255, .18); }
.six .hl { position: absolute; border: 1.5px dashed var(--pencil); background: rgba(76, 141, 255, .07); border-radius: 3px; pointer-events: none; }
.canvas.no-hl .six .hl { display: none; }
.bar-l { display: flex; align-items: center; gap: 10px; min-height: 36px; }
/* Your reply is a real text box: solid edge, blue ring while you type, drag the corner to make it taller. Dashed lines are kept for the slide outlines only. */
textarea.field { display: block; width: 100%; margin: 8px 0 0; padding: 10px 12px; min-height: 84px; max-height: 360px; field-sizing: content; border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px; background: var(--well); color: var(--ink); font: 400 15px/1.5 var(--sans); resize: vertical; cursor: text; caret-color: var(--pencil); transition: border-color .15s, box-shadow .15s; }
textarea.field:hover { border-color: rgba(255, 255, 255, .28); }
textarea.field:focus { outline: none; border-color: var(--pencil); box-shadow: 0 0 0 3px rgba(76, 141, 255, .28); }
textarea.field::placeholder { color: var(--faint); }
.redline li.editing textarea.inline { margin-top: 4px; padding: 8px 10px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 10px; background: var(--well); resize: vertical; }
.redline li.editing textarea.inline:focus { border-color: var(--pencil); box-shadow: 0 0 0 3px rgba(76, 141, 255, .28); }
.icon-btn { margin-left: auto; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--slate); cursor: pointer; }
.icon-btn:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.gen, .add-reply { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; padding: 7px 12px; border: 0; border-radius: 10px; background: var(--well); box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); color: var(--ink); font: 500 13px var(--sans); cursor: pointer; }
.gen:hover, .add-reply:hover { background: var(--well-hover); }
.gen svg, .add-reply svg { width: 16px; height: 16px; }
.gen svg { color: var(--pencil-text); }
.gen[disabled] { cursor: default; color: var(--slate); }
.gen .spin { margin-right: 0; }
/* Chat sides: the reviewer's bubble sits left with its point bottom-left; yours sits right, tinted blue, avatar on the right, point bottom-right */
.fate svg { width: 17px; height: 17px; flex: none; }
.fate .link { margin-left: 4px; font-size: 14px; }
.thumb.all .tile { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--well); box-shadow: 0 0 0 1px rgba(255, 255, 255, .14); color: var(--ink); }
.thumb.all .tile svg { width: 20px; height: 20px; }
.thumb.all:hover .tile { background: var(--well-hover); }
.bar .state { margin: 0; }
.six .tag { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px 7px 11px; border-radius: 999px; white-space: nowrap; font: 500 14px var(--sans); color: var(--ink); background: rgba(14, 14, 14, .88); box-shadow: 0 0 0 1px rgba(255, 255, 255, .14); pointer-events: none; }
.six .tag svg, .six .badge svg { width: 17px; height: 17px; flex: none; }
.six .badge { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--pencil); color: var(--canvas); pointer-events: none; }
.six .badge svg { width: 15px; height: 15px; }
.thumb img, .six img { border-radius: 6px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08); }
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; background: transparent; border-top: 1px solid rgba(255, 255, 255, .06); padding: 12px 24px 16px; }
.chip img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; box-shadow: 0 0 0 1px var(--edge); display: block; background: #fff; opacity: .75; border-radius: 6px; }
/* a rounded panel, like the slide window */
.side-top { padding: 22px 22px 8px; display: grid; gap: 10px; }
.side-title { font-size: 16px; font-weight: 500; margin-right: auto; }
.where-line { font-size: 14px; color: var(--slate); }
.where-line b { color: var(--ink); font-weight: 500; }
.help { font-size: 14px; color: var(--slate); line-height: 1.5; }
.who b, .label, .status b { font-weight: 500; }
.reply p, .also p { font-family: var(--sans); }
/* No outline on the comment you're on: blue dashes only ever mean "this changed on the slide". The open one is simply the one that's open. */
.cmt.many { padding: 14px; box-shadow: none; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .05); }
.cmt.many.folded { gap: 6px; padding: 10px 10px 6px; cursor: pointer; background: transparent; }
.cmt.many.folded + .cmt.many, .cmt.many + .cmt.many.folded { margin-top: 4px; }
/* Blue dashes are kept for one meaning only, "this changed on the slide". The wording you can edit is a plain field. */
.redline li.tap:hover { box-shadow: none; outline: 1px solid rgba(255, 255, 255, .16); outline-offset: 0; }
.redline li.editing { box-shadow: none; outline: 0; background: transparent; }
.btn.primary, .go { background: var(--ink); color: var(--canvas); box-shadow: none; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 55dvh minmax(0, 1fr); }
  .canvas { margin: 8px; border-radius: 20px; }
  .pill { gap: 12px; font-size: 14px; }
  .pill-title { display: none; }
  .stop { padding: 76px 16px 12px; }
  .stop-in { width: min(calc(100cqw - 32px), calc((100cqh - 88px - var(--extra)) * 16 / 9)); }
  .pillsw { width: 168px; height: 32px; }
  .six .tag { font-size: 12px; padding: 5px 10px 5px 8px; }
}
/* ---------- sidebar ---------- */
.side { margin: 12px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, .06); min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sheet); }
.side-head { border: 0; display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.side-head p { margin-right: auto; font-size: 14px; color: var(--slate); }
.side-head p b { color: var(--ink); }
.step { box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); width: 32px; height: 32px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer; font-size: 15px; line-height: 1; }
.step:hover:not(:disabled) { border-color: var(--slate); }
.side-body { overflow-y: auto; padding: 18px; display: grid; gap: 14px; align-content: start; }
.who { font-size: 14px; color: var(--slate); }
.who b { color: var(--ink); }
.claude { border-top-color: rgba(255, 255, 255, .07); display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.label { font-size: 13px; font-weight: 700; color: var(--pencil); }
.label.mine { color: #B07F00; }
:root[data-theme="dark"] .label.mine { color: #F0C24A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .label.mine { color: #F0C24A; } }
.change { font-size: 15px; }
.redline { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 15px; }
.redline li { padding: 6px 10px; border-radius: 4px; background: var(--raise); box-shadow: 0 0 0 1px var(--edge); }
.ctx { display: block; font-size: 12px; font-weight: 700; color: var(--slate); margin-bottom: 1px; }
del { color: var(--slate); text-decoration-color: var(--slate); }
ins { text-decoration: none; background: var(--pencil-wash); color: var(--ink); box-shadow: inset 0 -2px 0 var(--pencil); padding: 0 1px; }
.note { font-size: 13px; color: var(--slate); }
.why, .also { font-size: 14px; color: var(--slate); }
.why summary:hover, .also summary:hover { color: var(--ink); }
.also p { margin-top: 6px; font: 400 15px/1.55 var(--serif); color: var(--ink); }
.reply p { font: 400 15px/1.55 var(--serif); }
.opts { display: grid; gap: 6px; }
.opt small { font-weight: 400; color: var(--slate); }
.act { display: grid; gap: 10px; justify-items: start; padding-top: 4px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); font-size: 14px; font-weight: 700; border: 1.5px solid var(--line); background: transparent; border-radius: 6px; padding: 7px 14px; min-height: 38px; cursor: pointer; }
.btn:hover { background: var(--well-hover); border-color: var(--slate); }
.box { display: grid; gap: 8px; width: 100%; }
.box label { font-size: 13px; font-weight: 700; }
.box label .ctx { display: inline; margin: 0; }
.box textarea { border-color: rgba(255, 255, 255, .12); width: 100%; min-height: 44px; field-sizing: content; resize: vertical; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--raise); }
.box textarea:focus { outline: 2px solid var(--pencil); outline-offset: 1px; border-color: var(--pencil); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.link { text-decoration-color: rgba(255, 255, 255, .35); font-size: 13px; font-weight: 700; color: var(--pencil); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link.quiet { color: var(--slate); }
.status { font-size: 14px; }
.status b { color: var(--pencil); }
/* ---------- approve panel ---------- */
.side-foot { padding: 16px 18px 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.seen { display: grid; gap: 6px; font-size: 13px; color: var(--slate); }
.seen b { color: var(--ink); }
.meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--pencil); transform: scaleX(0); transform-origin: left; }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: transform .3s ease; } }
.tally { font-size: 13px; color: var(--slate); }
.tally b { color: var(--ink); }
/* Something didn't get through: the server is unreachable, or a reply didn't post */
.tally.warn, .msg.out .msg-body > p.msg-sub.warn { color: #F2B36B; }
.msg-sub .spin { margin-right: 6px; vertical-align: -2px; }
.msg-sub.sent-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.msg-sub.sent-row .link { font-size: 12px; padding: 0; }
.go:disabled { opacity: .6; cursor: progress; }
.foot-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.done { display: grid; gap: 10px; }
.done h2 { font-size: 18px; }
.done p { font-size: 14px; color: var(--slate); }
.sum { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--slate); }
.sum b { color: var(--ink); font-weight: 500; }
.go-deck { display: flex; align-items: center; justify-content: center; text-decoration: none; }
/* ---------- working: while Claude updates the deck or posts the replies ---------- */
.spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .sweep i { width: 40%; opacity: 1; animation: sweep 1.4s cubic-bezier(.45, 0, .55, 1) infinite; }
  .spin { animation: spin .8s linear infinite; }
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ---------- narrow screens: the slide stays pinned on top, comments and Approve scroll below it ---------- */
@media (max-width: 899px) {
  html, body { height: auto; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52dvh auto; }
  .canvas { position: sticky; top: 0; z-index: 3; margin: 8px; border-radius: 20px; height: calc(52dvh - 16px); }

<body>
<div class="app">
  <section class="canvas" aria-label="Slides">
    <header class="pill">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 4.5h13v9h-7l-4 3v-3h-2z"/></svg></span>
      <h1 class="pill-title" id="deckTitle">Review</h1>
      <p class="pill-pos" aria-live="polite"><b id="posW">Slide 1</b><span id="posT"></span></p>
      <a class="pill-btn" id="deckLink" href="#" target="_blank" rel="noopener">Open in Figma</a>
    </header>
    <div class="scroller" id="scroller" tabindex="-1"></div>
    <nav class="strip" id="strip" aria-label="Jump to a comment"></nav>
  </section>

  <aside class="side" aria-label="Comment and Claude's change">
    <div class="side-top">
      <div class="side-head">
        <h2 class="side-title">Comments</h2>
        <button type="button" class="step" id="prev" aria-label="Previous slide">↑</button>
        <button type="button" class="step" id="next" aria-label="Next slide">↓</button>
      </div>
      <p class="where-line" id="sideWhere"></p>
      <p class="help" id="help">All of this slide's comments are here. Open one, or click its pin on the slide, and approve them one at a time.</p>
    </div>
    <div class="side-body" id="sideBody" aria-live="polite"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
</div>

<script>
const IMG = n => `img/${n}.png`;
let DATA = null, DECK = "#", PEOPLE = {}, HL = {}, CARDS = [];
const first = k => (PEOPLE[k] || k).split(" ")[0];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ---------- grouping: one stop per slide ---------- */
const STOPS = [];
const byId = id => CARDS.find(c => c.id === +id);
const stopOf = id => STOPS.findIndex(s => s.ids.includes(+id));
function group() {
  STOPS.length = 0;
  CARDS.forEach(c => {
    let s = STOPS.find(x => x.n === c.slide);
    if (!s) {
      const r = c.range, a = r && r[0][0], b = r && r[r.length - 1][0];
      s = { n: c.slide, label: r ? `Slides ${a} to ${b}` : `Slide ${c.slide}`, short: r ? `${a}–${b}` : String(c.slide), ids: [] };
      STOPS.push(s);
    }
    s.ids.push(c.id);
  });
  STOPS.sort((a, b) => a.n - b.n);
}
/* Changes that span several slides are decided once, on their first slide. The other slides get a pointer. */
const alsoFor = s => CARDS.filter(c => (c.alsoOn || []).includes(s.n) && !s.ids.includes(c.id));

/* ---------- state ---------- */
/* Saved per deck and round, so two reviews served from the same address never share decisions */
let KEY = "blueline:" + location.pathname;
const fresh = () => ({ cards: {}, picks: {}, edits: {}, replies: {}, seen: [], later: {}, base: {}, usedDrafts: [] });
let S = fresh();
function loadState() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.cards) S = Object.assign(fresh(), s); } catch (e) {} }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
/* Your wording, reply and pick are saved with the Claude version they were made on. When Claude redoes the card,
   or a new run brings new drafts under the same deck and round, a saved change made on the old version is dropped,
   so it never shows over Claude's new one (or goes into the deck instead of it). */
const sigEdit = c => JSON.stringify((c.edit || []).map(e => e.after));
const sigOpts = c => JSON.stringify((c.options || []).map(o => [o.key, o.name, o.desc]));
function noteBase(c) { S.base[c.id] = { edit: sigEdit(c), reply: c.reply || "", opts: sigOpts(c) }; }
function dropStale() {
  CARDS.forEach(c => {
    const b = S.base[c.id];
    if (b) {
      if (S.edits[c.id] && (b.edit !== sigEdit(c) || S.edits[c.id].length !== (c.edit || []).length)) delete S.edits[c.id];
      /* a reply card's reply is Claude's draft, so a new draft replaces it; on other cards a reply you wrote yourself stays */
      if (S.replies[c.id] != null && b.reply !== (c.reply || "") && (c.kind === "reply" || S.replies[c.id] === b.reply)) delete S.replies[c.id];
      if (S.picks[c.id] && (b.opts !== sigOpts(c) || !(c.options || []).some(o => o.key === S.picks[c.id]))) delete S.picks[c.id];

/* ---------- live: each decision goes to Claude the moment you make it ---------- */
/* The server records what you decide (acts) and hands back how Claude is getting on (progress).

let OFF = false, OFFWHY = "", SENT = false, inflight = 0;
const LATER = {};                 // card id -> later replies, from the server
const UNSENT = {};                // card id -> why its last decision didn't reach the server
async function send(c, body) {
  inflight++;

  try {
    const r = await fetch("api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ id: c.id }, body)) });
    const res = await r.json().catch(() => ({}));
    if (r.ok) n = res.n; else why = res.error || `the review server said ${r.status}`;
  } catch (e) { why = "Claude's review server didn't answer. Is it still running?"; }
  inflight--;
  if (why == null) { OFF = false; SENT = true; delete UNSENT[c.id]; poll(); return n; }
  /* Nothing was recorded, so nothing will happen: put the card back the way the server has it, and say why */
  UNSENT[c.id] = why;
  if (!/didn't answer/.test(why)) OFF = false; else OFF = true;
  lastSeen = "";
  if (LASTST) fromServer(LASTST);
  if (cur >= 0 && stopOf(c.id) === cur && !mode && !editing) show(c.id);   // back to the comment that didn't go, if it's on this slide
  else keepFocus(refresh);

  return null;
}
async function poll() {
  if (inflight) return;           // a decision is on its way; don't let an older answer undo it on screen
  let why = "";
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    if (!r.ok) { why = (await r.json().catch(() => ({}))).error || ""; throw new Error(String(r.status)); }
    const st = await r.json();
    if (OFF) { OFF = false; OFFWHY = ""; keepFocus(refresh); }
    if (!inflight) fromServer(st);
  } catch (e) {
    /* say it once, and again only if the reason changes (a damaged acts.json says which file) */
    if (!OFF || why !== OFFWHY) { OFF = true; OFFWHY = why; keepFocus(refresh); }
  }
}

    else if (a.act === "approve") d = mine ? { st: mine.st, t: a.n, why: mine.why } : { st: "queued", t: a.n };

      if (d.revised && (!old || old.revised !== a.n)) reload = true;   // Claude redid it: fetch the new preview and wording
    }
    else if (a.act === "undo") d = !mine ? { st: "undo", t: a.n } : mine.st === "open" ? null : mine.st === "failed" ? { st: "in", t: a.n, why: `Couldn't take it out: ${mine.why || "Claude will say why."}` } : { st: mine.st, t: a.n, why: mine.why };
    if (d) S.cards[c.id] = d; else delete S.cards[c.id];
    /* An approved card shows the wording, reply and pick that were sent, in every window, whatever this one had saved */
    if (a && a.act === "approve") {
      if (c.edit && Array.isArray(a.edit) && a.edit.length === c.edit.length) {
        if (a.edit.every((x, k) => x === c.edit[k].after)) delete S.edits[c.id]; else S.edits[c.id] = a.edit.slice();
      }
      if (typeof a.reply === "string") setReply(c, a.reply);
      if (c.kind === "pick" && a.pick) S.picks[c.id] = a.pick;
      noteBase(c);
    }
  });
  const PL = (st.progress || {}).later || {};
  Object.keys(LATER).forEach(k => delete LATER[k]);
  /* A later reply you pressed Undo on: "removing" until it's out of the thread, then gone. If it couldn't come out, it stays posted and says why. */
  const PU = (st.progress || {}).unlater || {}, un = {};
  ((st.acts || {}).unlater || []).forEach(u => { un[u.of] = PU[u.n] || { st: "pending" }; });
  ((st.acts || {}).later || []).forEach(x => {
    const p = PL[x.n] || {}, u = un[x.n];
    if (p.st === "removed") return;
    const e = { n: x.n, text: x.text, st: p.st || "posting", why: p.why };
    if (u && u.st === "failed") e.why = `Couldn't take it out: ${u.why || "Claude will say why."}`;
    else if (u && p.st === "posted") e.st = "removing";
    (LATER[x.id] ||= []).push(e);
  });
  const PD = (st.progress || {}).drafts || {}, lastDraft = {};
  ((st.acts || {}).drafts || []).forEach(x => { lastDraft[`${x.id}:${x.for}`] = x.n; });
  ((st.acts || {}).drafts || []).forEach(x => {
    const k = `${x.id}:${x.for}`, text = (PD[x.n] || {}).text, c = byId(x.id);
    if (!text || !c || S.usedDrafts.includes(x.n)) return;
    /* After a reload this window no longer knows it asked: the newest draft still lands, if its box is empty */
    const orphan = !drafting.has(k) && lastDraft[k] === x.n && (x.for === "later" ? !(laterDraft.get(c.id) || "").trim() : isOpen(c) && !hasReply(c));
    if (drafting.get(k) !== x.n && !orphan) return;
    drafting.delete(k); S.usedDrafts.push(x.n);
    if (x.for === "later") laterDraft.set(c.id, text);
    else { genText.set(c.id, text); S.replies[c.id] = text; replyOpen.add(c.id); }
  });
  save();
  if (cur < 0) return;            // first load: build() draws everything next
  if (reload) reloadCards(); else keepFocus(refresh);
}
/* After Claude redoes a card it rewrites data.json and adds new images; take them in without a page reload */
async function reloadCards() {
  try {
    const d = await (await fetch("data.json", { cache: "no-store" })).json();
    DATA = d; HL = d.highlights || {}; CARDS = d.cards || [];
    dropStale();
    save();
    STOPS.forEach((_, i) => renderStop(i));
    keepFocus(refresh);
  } catch (e) { keepFocus(refresh); }
}

/* ---------- demo: with no server, Claude's side is acted out on a timer ---------- */
let busy = false, gen = 0;
function refresh() { if (mode || editing) { document.getElementById("sideFoot").innerHTML = footHTML(); renderNav(); } else renderSide(); }
function tick() {
  if (busy || LIVE) return;
  const q = CARDS.filter(c => ["queued", "back", "undo"].includes(stOf(c))).sort((a, b) => S.cards[a.id].t - S.cards[b.id].t)[0];
  if (!q) return;
  busy = true;
  const g = gen, d = S.cards[q.id];
  const later = (ms, f) => setTimeout(() => { if (g === gen) f(); }, ms);
  const set = s => { S.cards[q.id] = Object.assign({}, S.cards[q.id], { st: s }); save(); refresh(); };
  const done = () => { busy = false; tick(); };
  if (d.st === "queued" && q.kind === "reply" && !hasReply(q)) { set("closed"); done(); }
  else if (d.st === "queued" && q.kind === "reply") { set("posting"); later(1600, () => { set("posted"); done(); }); }
  else if (d.st === "queued") { set("applying"); later(3200, () => { if (hasReply(q)) { set("posting"); later(1400, () => { set("in"); done(); }); } else { set("in"); done(); } }); }
  else if (d.st === "back") { set("revising"); later(4000, () => { S.cards[q.id] = { st: "open", revised: true, note: d.note }; save(); refresh(); done(); }); }
  else if (d.st === "undo") {
    const reopen = () => { delete S.cards[q.id]; save(); refresh(); done(); };
    const down = () => { set("unposting"); later(1500, reopen); };
    if (d.from === "posted") down();
    else { set("undoing"); later(2200, () => hasReply(q) ? down() : reopen()); }
  }
}
/* After a decision, move to the next comment that still needs one: on this slide first, then the slides after it */
function advance() {
  if (mode || editing) return;
  const here = STOPS[cur].ids.find(id => isOpen(byId(id)));
  if (here) { if (activeOf(cur).id !== here) show(here); return; }
  for (let k = 1; k < STOPS.length; k++) {
    const i = (cur + k) % STOPS.length, id = STOPS[i].ids.find(x => isOpen(byId(x)));
    if (id) { if (activeOf(i).id !== id) { active[i] = id; renderStop(i); } go(i); return; }
  }
}
init().then(tick);

document.getElementById("prev").addEventListener("click", () => go(cur - 1));
document.getElementById("next").addEventListener("click", () => go(cur + 1));
document.addEventListener("keydown", e => {
  if (e.target.dataset && e.target.dataset.live) {
    const [id, j] = e.target.dataset.live.split(":");
    if (j === "r" && e.key === "Escape" && !e.target.value.trim()) { const c = byId(id); setReply(c, ""); replyOpen.delete(c.id); save(); renderSide(); }
    return;
  }
  if (e.target.dataset && e.target.dataset.later != null) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); postLater(byId(e.target.dataset.later)); }
    else if (e.key === "Escape") { laterDraft.delete(+e.target.dataset.later); laterOpen.delete(+e.target.dataset.later); renderSide(); }
    return;
  }
  if (e.target.closest && e.target.closest("textarea")) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { const b = e.target.closest(".box")?.querySelector('[data-act="send"]'); b && b.click(); }
    if (e.key === "Escape" && mode) { mode = null; renderSide(); }
    return;
  }
  if (e.key === "Escape" && cur >= 0) { const c = activeOf(cur); if (zoom[c.id] != null) { unzoom(c.id); return; } }
  const pk = e.target.closest && e.target.closest(".pillsw");
  if (pk && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); setNow(pillStage(pk), e.key === "ArrowLeft"); pk.querySelector('[aria-checked="true"]').focus(); return; }
  if (["ArrowDown", "PageDown", "j"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowUp", "PageUp", "k"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
});

/* Click the slide to see it as it is now; click again for the change. Space or Enter does the same from the keyboard. */
function setNow(s, on) {
  s.classList.toggle("is-now", on); s.setAttribute("aria-pressed", on);
  const w = s.closest(".stop-in"); if (!w) return;
  w.classList.toggle("is-now", on);
  w.querySelectorAll(".pillsw [data-side]").forEach(b => { const me = (b.dataset.side === "now") === on; b.setAttribute("aria-checked", me); b.tabIndex = me ? 0 : -1; });
}
/* The Before / After pill: tap a side, tap the pill to flip, or drag the knob and let go */
let pd = null;
const pillPos = (d, x) => { const r = d.getBoundingClientRect(), k = (r.width - 6) / 2; return Math.min(1, Math.max(0, (x - r.left - 3 - k / 2) / k)); };
const pillStage = d => d.closest(".stop-in").querySelector("[data-stage]");
document.addEventListener("pointerdown", e => { const d = e.target.closest(".pillsw"); if (!d || e.button) return; pd = { d, x: e.clientX, moved: false }; d.setPointerCapture(e.pointerId); });
document.addEventListener("pointermove", e => { if (!pd) return; if (Math.abs(e.clientX - pd.x) > 4) pd.moved = true; if (pd.moved) { pd.d.classList.add("dragging"); pd.d.style.setProperty("--p", pillPos(pd.d, e.clientX)); } });
document.addEventListener("pointerup", e => { if (!pd) return; const { d, moved } = pd; pd = null; if (!moved) return;
  d._dragged = true; d.classList.remove("dragging"); d.style.removeProperty("--p"); setNow(pillStage(d), pillPos(d, e.clientX) < .5); });
document.addEventListener("pointercancel", () => { if (pd) { pd.d.classList.remove("dragging"); pd.d.style.removeProperty("--p"); pd = null; } });

function show(id) {
  active[cur] = +id; renderStop(cur); renderSide();
  const open = document.querySelector(`#sideBody .cmt[data-sel="${+id}"]`);   /* bring the comment you just opened into view */
  if (open) open.scrollIntoView({ block: "nearest", behavior: calm() ? "auto" : "smooth" });
}
document.addEventListener("click", e => {
  const p = e.target.closest(".pillsw");
  if (p) { if (p._dragged) { p._dragged = false; return; } const b = e.target.closest("[data-side]"), st = pillStage(p); setNow(st, b ? b.dataset.side === "now" : !st.classList.contains("is-now")); return; }
  const zi = e.target.closest("[data-zoom]");
  if (zi) { const [id, n] = zi.dataset.zoom.split(":"); zoomTo(id, +n); return; }
  const zo = e.target.closest("[data-unzoom]");
  if (zo) { unzoom(zo.dataset.unzoom); return; }
  const pin = e.target.closest("[data-pin]");
  if (pin) {   /* a pin opens its comment; one decided on another slide takes you to that slide */
    const id = +pin.dataset.pin, i = stopOf(id);
    if (i === cur) show(id); else { active[i] = id; renderStop(i); go(i); }
    return;
  }
  const s = e.target.closest("[data-stage]");
  if (s) { setNow(s, !s.classList.contains("is-now")); return; }
  const g = e.target.closest("[data-go]");
  if (g) { go(+g.dataset.go); return; }
  const th = e.target.closest("[data-shot]");
  if (th) { const [id, j] = th.dataset.shot.split(":"); shotIdx[id] = +j; renderStop(stopOf(id)); return; }
  if (e.target.closest("[data-outlines]")) { setOutlines(!outlines); return; }
  const sh = e.target.closest("[data-show]");
  if (sh) { show(sh.dataset.show); return; }
  const op = e.target.closest("[data-pick]");
  if (op) { const c = byId(op.dataset.id); if (!isOpen(c)) return; delete zoom[c.id]; S.picks[c.id] = op.dataset.pick; save(); active[cur] = c.id; renderStop(cur); renderSide(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act, c = byId(a.dataset.id);
    if (STOPS[cur].ids.length > 1 && activeOf(cur).id !== c.id) { active[cur] = c.id; renderStop(cur); }
    /* Focus the note box itself: the card's new wording is a text field too, and a note typed there would go into the deck */
    if (act === "nq") { mode = { id: c.id, kind: act }; renderSide(); const t = document.getElementById("nq-" + c.id); if (t) t.focus(); }
    else if (act === "cancel") { mode = null; renderSide(); }
    else if (act === "send") {
      const t = document.getElementById("nq-" + c.id), note = t.value.trim();
      if (!note) { t.focus(); t.placeholder = "Say what's off so Claude can fix it"; return; }
      S.cards[c.id] = { st: "back", note, t: Date.now() }; mode = null; save(); renderSide(); tick(); setTimeout(advance, 700);
      if (LIVE) send(c, { act: "back", note });
    }
    else if (act === "approve") {   /* stays on this slide so you can watch it go in */
      const close = c.kind === "reply" && !hasReply(c);   // a reply-only comment with the reply deleted: nothing to post
      S.cards[c.id] = close && LIVE ? { st: "closed" } : { st: "queued", t: Date.now() }; mode = null; editing = null; save(); renderSide(); tick();
      if (LIVE) send(c, close ? { act: "close" } : { act: "approve", edit: (c.edit || []).map((_, j) => lineText(c, j)),
        pick: c.kind === "pick" ? pickOf(c) : "", reply: hasReply(c) ? replyOf(c).trim() : "" });
      /* One by one: the next comment on this slide that still needs you opens. The slide itself stays put. */
      const at = cur;
      setTimeout(() => { if (cur !== at || mode || UNSENT[c.id]) return; const next = STOPS[at].ids.find(id => id !== c.id && isOpen(byId(id))); if (next && activeOf(at).id === c.id) show(next); }, 700);
    }
    else if (act === "skip") { S.cards[c.id] = { st: "skip" }; mode = null; save(); renderSide(); setTimeout(advance, 700); if (LIVE) send(c, { act: "skip" }); }
    else if (act === "undo") {
      const was = stOf(c);
      /* In the deck or posted: Claude takes the change out and the reply down. Skipped or closed: it just reopens. */
      const back = was === "in" || was === "posted";
      if (back) { S.cards[c.id] = { st: "undo", t: Date.now(), from: was }; tick(); } else delete S.cards[c.id];
      save(); renderSide();
      if (LIVE) send(c, { act: back ? "undo" : "reopen" });
    }
    else if (act === "postlater") postLater(c);
    else if (act === "unlater") unLater(c, +a.dataset.n);
    else if (act === "genlater" || act === "genreply") {
      const kind = act === "genlater" ? "later" : "reply";
      if (kind === "reply" && c.reply) {   /* Claude already wrote this card's reply (with its source): it goes straight in */
        setReply(c, c.reply); genText.set(c.id, c.reply); replyOpen.add(c.id); save(); renderSide(); focusReply(c);
      } else if (LIVE) {   /* Claude writes it; the text lands in the box when it's ready */
        drafting.set(`${c.id}:${kind}`, -1); renderSide();
        send(c, { act: "draft", for: kind }).then(n => { if (n == null) drafting.delete(`${c.id}:${kind}`); else if (drafting.get(`${c.id}:${kind}`) === -1) drafting.set(`${c.id}:${kind}`, n); lastSeen = ""; poll(); keepFocus(refresh); });
      } else {
        a.disabled = true; a.textContent = "Drafting…"; a.classList.add("busy");
        if (kind === "later") setTimeout(() => { laterDraft.set(c.id, c.reply && !hasReply(c) ? c.reply : standIn(c)); renderSide(); focusLater(c); }, 900);
        else setTimeout(() => { const t = standIn(c); genText.set(c.id, t); setReply(c, t); replyOpen.add(c.id); save(); renderSide(); focusReply(c); }, 900);
      }
    }
    else if (act === "delreply") { setReply(c, ""); genText.delete(c.id); replyOpen.delete(c.id); save(); renderSide(); }
    else if (act === "openlater") { laterOpen.add(c.id); renderSide(); focusLater(c); }
    else if (act === "closelater") { laterDraft.delete(c.id); laterOpen.delete(c.id); renderSide(); }
    else if (act === "addreply") { replyOpen.add(c.id); renderSide(); focusReply(c); }
    else if (act === "revert") { if (!isOpen(c)) return; if (c.kind === "reply") delete S.replies[c.id]; else { delete S.edits[c.id]; renderStop(stopOf(c.id)); } save(); renderSide(); }
    return;
  }
  /* Clicking anywhere else on a comment (in a slide with several) puts its change on the big slide */
  const sel = e.target.closest("[data-sel]");
  if (sel && !e.target.closest("button, a, summary, textarea") && activeOf(cur).id !== +sel.dataset.sel) { show(sel.dataset.sel); return; }
  if (e.target.id === "reset") {
    if (LIVE) fetch("api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {});
    S = fresh(); dropStale(); save(); mode = null; gen++; busy = false;
    Object.keys(UNSENT).forEach(k => delete UNSENT[k]);
    [active, shotIdx, zoom, LATER].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    [replyOpen, genText, laterDraft, laterOpen, whyOpened, drafting].forEach(s => s.clear()); editing = null; lastSeen = "";
    STOPS.forEach((_, i) => renderStop(i)); scroller.scrollTop = 0; markSeen(0); renderSide();
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.later != null) {
    const c = byId(e.target.dataset.later), v = e.target.value, box = e.target.closest(".rb-field");
    laterDraft.set(c.id, v);
    if (box && box.classList.contains("empty") === !!v.trim()) { const pos = e.target.selectionStart; renderSide(); const t = document.querySelector(`textarea[data-later="${c.id}"]`); if (t) { t.focus(); t.setSelectionRange(pos, pos); } }
    return;
  }
  const lv = e.target.dataset && e.target.dataset.live;
  if (lv) {
    const [id, j] = lv.split(":"), c = byId(id), v = e.target.value;
    if (j === "r") { setReply(c, v); const del = !!v.trim(), box = e.target.closest(".msg-body"); if (box && (!!box.querySelector(".icon-btn") !== del || !!box.querySelector(".gen") === del)) { const pos = e.target.selectionStart; renderSide(); const t = document.querySelector(`textarea[data-live="${c.id}:r"]`); if (t) { t.focus(); t.setSelectionRange(pos, pos); } } }
    else {
      const was = edited(c), arr = c.edit.map((x, k) => lineText(c, k)); arr[+j] = v;
      if (arr.every((x, k) => x === c.edit[k].after)) delete S.edits[c.id]; else { S.edits[c.id] = arr; noteBase(c); }
      /* The moment your wording differs from Claude's (or goes back to it), say so: "Your edit" in the panel, and a note
         on the slide that the picture still shows Claude's version. Only redraw on that switch, not on every key. */
      if (edited(c) !== was) { save(); keepFocus(() => { const i = stopOf(c.id); if (activeOf(i).id === c.id) renderStop(i); renderSide(); }); return; }
    }
    save();
  }
});

/* Reply boxes grow with their text in every browser (field-sizing isn't everywhere yet), so there's never an inner scrollbar */
function fit(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + (t.offsetHeight - t.clientHeight) + "px"; }   /* add back only the border it actually has */
document.addEventListener("input", e => { if (e.target.matches && e.target.matches("textarea.field, .rb-field textarea")) fit(e.target); });
/* "Drafted by Claude" drops off the moment you change the wording, and comes back if you type it back to Claude's */
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.live; if (!k || !k.endsWith(":r")) return; const sub = e.target.closest(".msg-body")?.querySelector(".msg-sub"); if (sub) sub.hidden = !byClaude(byId(k.split(":")[0])); });
const fitAll = () => document.querySelectorAll("#sideBody textarea.field, #sideBody .rb-field textarea").forEach(fit);
new MutationObserver(fitAll).observe(document.getElementById("sideBody"), { childList: true, subtree: true });
new ResizeObserver(fitAll).observe(document.getElementById("sideBody"));   // the panel's width settles after fonts load
if (document.fonts) document.fonts.ready.then(fitAll);
