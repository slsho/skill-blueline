/* The slide fills the screen, one stop per slide; scroll down for the next. The sidebar holds that slide's

/* Built on Figma's Simple Design System (SDS), Dark mode: every colour, space, corner, stroke, type size and

:root {
  color-scheme: dark;
  /* SDS colour, Dark mode */
  --sds-color-background-default-default: #1e1e1e;
  --sds-color-background-default-default-hover: #383838;
  --sds-color-background-default-secondary: #2c2c2c;

  --sds-color-background-neutral-tertiary-hover: #242424;
  --sds-color-background-brand-default: #f5f5f5;
  --sds-color-background-brand-hover: #d9d9d9;
  --sds-color-background-brand-secondary: #444444;
  --sds-color-background-positive-default: #008043;
  --sds-color-background-warning-default: #e8b931;
  --sds-color-background-disabled-default: #383838;
  --sds-color-text-default-default: #ffffff;
  --sds-color-text-default-secondary: #ffffffb2;
  --sds-color-text-default-tertiary: #ffffff66;
  --sds-color-text-brand-on-brand: #1e1e1e;
  --sds-color-text-positive-secondary: #85e0a3;
  --sds-color-text-warning-secondary: #e8b931;
  --sds-color-border-default-default: #444444;
  --sds-color-border-default-secondary: #757575;
  --sds-color-border-neutral-secondary: #949494;
  --sds-color-border-brand-default: #f5f5f5;
  --sds-color-border-positive-secondary: #85e0a3;
  --sds-color-icon-default-default: #ffffff;
  --sds-color-icon-default-secondary: #ffffffb2;
  --sds-color-icon-brand-on-brand: #1e1e1e;
  --sds-color-icon-positive-on-positive: #ebffee;
  --sds-color-icon-disabled-default: #757575;
  /* SDS colour primitives: the slide well, slide paper, shadow, the change blue, and avatar colours */
  --sds-color-gray-1000: #111111;
  --sds-color-white-1000: #ffffff;
  --sds-color-black-400: #0c0c0d66;
  --sds-color-blue-400: #9ebef1;
  --sds-color-blue-500: #3f81ea;
  --sds-color-blue-900: #183057;
  --sds-color-slate-700: #5a5a5a;
  --sds-color-yellow-700: #975102;
  --sds-color-green-700: #008043;
  --sds-color-pink-700: #ba2a92;
  --sds-color-pink-900: #57184a;
  /* SDS size */
  --sds-size-space-050: 2px;
  --sds-size-space-100: 4px;
  --sds-size-space-150: 6px;
  --sds-size-space-200: 8px;
  --sds-size-space-300: 12px;
  --sds-size-space-400: 16px;
  --sds-size-space-600: 24px;
  --sds-size-space-800: 32px;
  --sds-size-space-1200: 48px;
  --sds-size-space-1600: 64px;
  --sds-size-space-2400: 96px;
  --sds-size-radius-100: 4px;
  --sds-size-radius-200: 8px;
  --sds-size-radius-400: 16px;
  --sds-size-radius-full: 9999px;
  --sds-size-stroke-border: 1px;
  --sds-size-stroke-focus-ring: 2px;
  /* SDS typography */
  --sds-typography-body-font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sds-typography-body-size-small: 14px;
  --sds-typography-body-size-medium: 16px;
  --sds-typography-body-font-weight-regular: 400;
  --sds-typography-body-font-weight-strong: 600;
  --sds-typography-scale-01: 12px;
  --sds-typography-heading-size-small: 20px;
  --sds-typography-heading-font-weight: 600;
  /* SDS effect style */
  --sds-effects-drop-shadow-600: 0 16px 32px -8px var(--sds-color-black-400);
  /* Blueline's names for SDS tokens (built from the tokens above only) */
  --bl-ring: 0 0 0 var(--sds-size-stroke-border) var(--sds-color-border-default-default);
  --bl-ring-selected: 0 0 0 var(--sds-size-stroke-focus-ring) var(--sds-color-border-brand-default);

}
*, *::before, *::after { box-sizing: border-box; }

.pill-pos b { color: var(--sds-color-text-default-default); font-weight: var(--sds-typography-body-font-weight-strong); }
/* A short note under the top pill, e.g. when the demo's Open in Figma has no deck to open */
.toast { position: absolute; top: calc(var(--sds-size-space-1600) + var(--sds-size-space-200)); left: 50%; z-index: 6; margin: 0; padding: var(--sds-size-space-200) var(--sds-size-space-300); border-radius: var(--sds-size-radius-200); background: var(--sds-color-background-default-default); box-shadow: var(--bl-ring), var(--sds-effects-drop-shadow-600); color: var(--sds-color-text-default-default); font: var(--bl-text-small); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%, -4px); }

@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .18s ease, transform .18s ease; } }
.side { margin: var(--sds-size-space-300); border-radius: var(--sds-size-radius-400); overflow: hidden; box-shadow: var(--bl-ring); min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sds-color-background-default-secondary); }

/* ---------- canvas: the slides ---------- */
.scroller { overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: no-preference) { .scroller { scroll-behavior: smooth; } }
.stop { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; container-type: size; display: grid; place-items: center; padding: var(--sds-size-space-2400) var(--sds-size-space-1200) var(--sds-size-space-400); }
.stop-in { display: grid; gap: var(--sds-size-space-200); width: min(calc(100cqw - 96px), calc((100cqh - 112px - var(--extra)) * 16 / 9)); --extra: 84px; }
.stop-in.has-thumbs { --extra: 158px; }

.stage { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: var(--sds-size-radius-200); background: var(--sds-color-white-1000); box-shadow: var(--bl-ring); cursor: pointer; overflow: visible; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.stage.is-now .hl { opacity: .35; }

.stage .hl .hl-who[data-pin] { pointer-events: auto; cursor: pointer; transform: translate(calc(-2px + var(--nudge, 0px)), 2px); }

.canvas.no-hl .stage .hl, .canvas.no-hl .six .hl { display: none; }
/* You've changed the wording: the picture is Claude's version, so its outlines go grey and the caption says so */
.stage.stale .hl { border-color: var(--sds-color-border-default-secondary); }
/* The commenter's pin, after Figma's: a round badge with one sharp corner, just outside the box's top-right corner */
.hl-who { position: absolute; display: block; z-index: 1; left: 100%; bottom: 100%; transform: translate(-2px, 2px); padding: var(--sds-size-space-050); border-radius: var(--sds-size-radius-full) var(--sds-size-radius-full) var(--sds-size-radius-full) 0; background: var(--sds-color-background-default-default); box-shadow: var(--bl-ring), var(--sds-effects-drop-shadow-600); }

.bar-l { display: flex; align-items: center; gap: var(--sds-size-space-200); min-height: 36px; }

.pillsw { --p: 1; position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 196px; height: 36px; padding: var(--sds-size-space-100); border-radius: var(--sds-size-radius-full); background: var(--sds-color-background-default-default); box-shadow: var(--bl-ring); touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }

  html, body { height: auto; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52dvh auto; }
  .canvas { position: sticky; top: 0; z-index: 3; margin: var(--sds-size-space-200); height: calc(52dvh - 16px); }
  .pill { top: var(--sds-size-space-200); gap: var(--sds-size-space-300); padding: var(--sds-size-space-100) var(--sds-size-space-100) var(--sds-size-space-100) var(--sds-size-space-300); font-size: var(--sds-typography-body-size-small); }
  .pill-btn { padding: var(--sds-size-space-150) var(--sds-size-space-300); }
  .pill-title { display: none; }
  .toast { top: calc(var(--sds-size-space-1200) + var(--sds-size-space-200)); }
  .stop { padding: var(--sds-size-space-1600) var(--sds-size-space-300) var(--sds-size-space-200); }
  .stop-in { --extra: 72px; width: min(100cqw, calc((100cqh - var(--extra)) * 16 / 9)); }
  .stop-in.has-thumbs { --extra: 160px; }
  .stop-in.grid6 { width: min(100cqw, calc((100cqh - 80px) * 2.5)); }
  .cap .r { display: none; }   /* no room for the click hint; tapping the slide still swaps it */
  .six .tag { font-size: var(--sds-typography-scale-01); padding: var(--sds-size-space-100) var(--sds-size-space-200); }
  .side { display: block; margin: 0 var(--sds-size-space-200) var(--sds-size-space-200); }
  .side-top { padding: var(--sds-size-space-300) var(--sds-size-space-400) var(--sds-size-space-100); }
  .side-body { overflow: visible; padding: var(--sds-size-space-200) var(--sds-size-space-400) var(--sds-size-space-400); }
  .side-foot { padding: var(--sds-size-space-300) var(--sds-size-space-400) calc(var(--sds-size-space-400) + env(safe-area-inset-bottom)); }
  .thumbs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }   /* one row that scrolls sideways */
  .thumb { width: 64px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { display: none; }
  .strip { padding: var(--sds-size-space-200) var(--sds-size-space-300); }
}
</style>
</head>
<body>
<div class="app">
  <section class="canvas" aria-label="Slides">
    <header class="pill">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 4.5h13v9h-7l-4 3v-3h-2z"/></svg></span>
      <h1 class="pill-title" id="deckTitle">Review</h1>
      <p class="pill-pos" aria-live="polite"><b id="posW">Slide 1</b><span id="posT"></span></p>
      <a class="pill-btn" id="deckLink" href="#" target="_blank" rel="noopener">Open in Figma</a>
    </header>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <div class="scroller" id="scroller" tabindex="-1"></div>
    <nav class="strip" id="strip" aria-label="Jump to a comment"></nav>
  </section>

  <aside class="side" aria-label="Comment and Claude's change">
    <div class="side-top">
      <div class="side-head">
        <h2 class="side-title">Comments</h2>
        <button type="button" class="step" id="prev" aria-label="Previous slide">↑</button>
        <button type="button" class="step" id="next" aria-label="Next slide">↓</button>
      </div>
      <p class="where-line" id="sideWhere"></p>
      <p class="help" id="help">All of this slide's comments are here. Open one, or click its pin on the slide, and approve them one at a time.</p>
    </div>
    <div class="side-body" id="sideBody" aria-live="polite"></div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
</div>

<script>
const IMG = n => `img/${n}.png`;
let DATA = null, DECK = "#", PEOPLE = {}, HL = {}, CARDS = [];
const first = k => (PEOPLE[k] || k).split(" ")[0];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ---------- grouping: one stop per slide ---------- */
const STOPS = [];
const byId = id => CARDS.find(c => c.id === +id);
const stopOf = id => STOPS.findIndex(s => s.ids.includes(+id));
function group() {
  STOPS.length = 0;
  CARDS.forEach(c => {
    let s = STOPS.find(x => x.n === c.slide);
    if (!s) {
      const r = c.range, a = r && r[0][0], b = r && r[r.length - 1][0];
      s = { n: c.slide, label: r ? `Slides ${a} to ${b}` : `Slide ${c.slide}`, short: r ? `${a}–${b}` : String(c.slide), ids: [] };
      STOPS.push(s);
    }
    s.ids.push(c.id);
  });
  STOPS.sort((a, b) => a.n - b.n);
}
/* Changes that span several slides are decided once, on their first slide. The other slides get a pointer. */
const alsoFor = s => CARDS.filter(c => (c.alsoOn || []).includes(s.n) && !s.ids.includes(c.id));

/* ---------- state ---------- */
/* Saved per deck and round, so two reviews served from the same address never share decisions */
let KEY = "blueline:" + location.pathname;
const fresh = () => ({ cards: {}, picks: {}, edits: {}, replies: {}, seen: [], later: {}, base: {}, usedDrafts: [] });
let S = fresh();
function loadState() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.cards) S = Object.assign(fresh(), s); } catch (e) {} }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
/* Your wording, reply and pick are saved with the Claude version they were made on. When Claude redoes the card,
   or a new run brings new drafts under the same deck and round, a saved change made on the old version is dropped,
   so it never shows over Claude's new one (or goes into the deck instead of it). */
const sigEdit = c => JSON.stringify((c.edit || []).map(e => e.after));
const sigOpts = c => JSON.stringify((c.options || []).map(o => [o.key, o.name, o.desc]));
function noteBase(c) { S.base[c.id] = { edit: sigEdit(c), reply: c.reply || "", opts: sigOpts(c) }; }
function dropStale() {
  CARDS.forEach(c => {
    const b = S.base[c.id];
    if (b) {
      if (S.edits[c.id] && (b.edit !== sigEdit(c) || S.edits[c.id].length !== (c.edit || []).length)) delete S.edits[c.id];
      /* a reply card's reply is Claude's draft, so a new draft replaces it; on other cards a reply you wrote yourself stays */
      if (S.replies[c.id] != null && b.reply !== (c.reply || "") && (c.kind === "reply" || S.replies[c.id] === b.reply)) delete S.replies[c.id];
      if (S.picks[c.id] && (b.opts !== sigOpts(c) || !(c.options || []).some(o => o.key === S.picks[c.id]))) delete S.picks[c.id];
    }
    noteBase(c);   // saved before this check existed: taken as made on what's here now
  });
}
const zoom = {};         // option card id -> slide number shown big from the grid
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastT = 0;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("on"); toastT = setTimeout(() => { t.textContent = ""; }, 200); }, 2200);
}
const EASE = "cubic-bezier(.2, .8, .2, 1)";
function fly(node, a, b) {
  node.animate([{ transformOrigin: "0 0", transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width})`, zIndex: 5 },
    { transformOrigin: "0 0", transform: "none", zIndex: 5 }], { duration: 460, easing: EASE });
}
const rise = nodes => nodes.forEach(n => n.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: 140, easing: EASE, fill: "backwards" }));
function zoomTo(id, n) {
  const i = stopOf(id), el = document.getElementById("st" + i), was = zoom[id] != null;
  const tile = el.querySelector(`.six [data-zoom="${id}:${n}"]`), a = tile && tile.getBoundingClientRect();
  zoom[id] = n; renderStop(i);
  if (was || !a || calm()) return;
  const big = el.querySelector(".stage"); fly(big, a, big.getBoundingClientRect());
  rise([...el.querySelectorAll(".bar, .cap, .thumbs")]);
}
function unzoom(id) {
  const i = stopOf(id), el = document.getElementById("st" + i), n = zoom[id];
  const big = el.querySelector(".stage"), a = big && big.getBoundingClientRect();
  delete zoom[id]; renderStop(i);
  const tile = el.querySelector(`.six [data-zoom="${id}:${n}"]`);
  if (!a || !tile || calm()) return;
  fly(tile, a, tile.getBoundingClientRect());
  rise([...el.querySelectorAll(".bar, figure")].filter(x => !x.contains(tile)));
}
let cur = -1;           // index of the stop (slide) in view
let mode = null;        // { id, kind: "nq" } for the open Not quite box
let editing = null;     // { id, j } the line (or "r" for the reply) being edited in place
/* Outlines around the changed areas on the slide: on by default, the choice is remembered in this browser */
let outlines = true;
try { outlines = localStorage.getItem("review-v3-outlines") !== "off"; } catch (e) {}
function setOutlines(on) {
  outlines = on;
  try { localStorage.setItem("review-v3-outlines", on ? "on" : "off"); } catch (e) {}
  document.querySelector(".canvas").classList.toggle("no-hl", !on);
  document.querySelectorAll("[data-outlines]").forEach(b => { b.textContent = on ? "Hide outlines" : "Show outlines"; b.setAttribute("aria-pressed", !on); });
}
const active = {};      // stop index -> comment id shown on the big slide
const shotIdx = {};
const stOf = c => (S.cards[c.id] || {}).st || "open";
const DONE = ["in", "posted", "closed", "skip"], WORK = ["queued", "applying", "posting", "back", "revising", "undo", "undoing", "unposting"];
/* "failed": Claude couldn't make the change. The card opens again with the reason, so you can approve it again or send it back. */
const isOpen = c => ["open", "failed"].includes(stOf(c));
const pickOf = c => S.picks[c.id] || c.pick;
/* A comment that only gets a reply starts with Claude's reply written out: the reply is the answer.
   A change request starts with no reply. You add one only if you want to ("Reply to Tom"), and Draft fills in the one Claude prepared. */
const startReply = c => c.kind === "reply" ? (c.reply || "") : "";
const replyOf = c => S.replies[c.id] ?? startReply(c);
const hasReply = c => !!replyOf(c).trim();
/* A reply equal to what the card starts with isn't stored; anything else is, including "" for a reply you deleted */
function setReply(c, v) { if (v === startReply(c)) delete S.replies[c.id]; else S.replies[c.id] = v; }
const replyOpen = new Set();   // cards where you pressed "Reply" but haven't typed yet
const genText = new Map();     // card id -> the reply Generate with Claude wrote (demo stand-in)
const byClaude = c => { const t = replyOf(c); return !!t && (t === c.reply || t === genText.get(c.id)); };
function standIn(c) {          // demo only: a real run asks Claude; here the reply is built from Claude's own note
  const who = first(c.who);
  if (c.kind === "pick") { const o = c.options.find(x => x.key === pickOf(c)); return `Thanks, ${who}. We're going with ${o.name.toLowerCase()}: ${o.desc}`; }
  return `Thanks, ${who}. ${c.change || "Done."}`;
}
const edited = c => !!S.edits[c.id];
const activeOf = i => byId(active[i] ?? STOPS[i].ids[0]);

/* ---------- canvas ---------- */
const ICON = (() => { const s = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  return {
    hide: s('<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.4 5.2A9.5 9.5 0 0 1 12 5c4.5 0 8 4 9 7a11.6 11.6 0 0 1-2.3 3.4M6.2 6.3C4.4 7.6 3.3 9.6 3 12c1 3 4.5 7 9 7a9.4 9.4 0 0 0 4.4-1.1"/>'),
    merge: s('<path d="m8 7 4-4 4 4"/><path d="M12 3v5.4a6.7 6.7 0 0 1-3 5.6 6.7 6.7 0 0 0-3 5.6V21"/><path d="M12 3v5.4a6.7 6.7 0 0 0 3 5.6 6.7 6.7 0 0 1 3 5.6V21"/>'),
    plus: s('<path d="M12 5v14M5 12h14"/>'),
    up: s('<path d="M12 19V5M6 11l6-6 6 6"/>'),
    trash: s('<path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>'),
    close: s('<path d="M6 6l12 12M18 6 6 18"/>'),
    reply: s('<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'),
    grid: s('<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>') }; })();
/* A slide with several comments, when Claude made one picture of it with every change in (data.json "stops"):
   every comment's pin is on it at once. The comment you're on has the bright pin; click any pin to open that comment.
   A change decided on another slide ("Also on this slide") gets a pin too, which takes you there. */
function comboHTML(c, sp) {
  const outl = `<button type="button" class="cap-btn" data-outlines aria-pressed="${!outlines}">${outlines ? "Hide outlines" : "Show outlines"}</button>`;
  const placed = [];
  const pins = Object.entries(sp.pins || {}).map(([k, bs]) => {
    const card = byId(k); if (!card) return "";
    const on = card.id === c.id;
    return bs.map(([x, y, w, h], j) => {
      let pin = "";
      if (j === 0) {   /* one pin per comment, on its first box; nudge it along if another pin already sits there */
        const ax = x + w, near = placed.filter(([px, py]) => Math.abs(px - ax) < 3 && Math.abs(py - y) < 5).length;
        placed.push([ax, y]);
        const away = stopOf(card.id) !== stopOf(c.id) ? ` (decided on ${STOPS[stopOf(card.id)].label.toLowerCase()})` : "";
        pin = `<span class="hl-who" data-pin="${card.id}" style="--nudge:${near * 30}px" title="${esc((PEOPLE[card.who] || card.who) + away)}">${avHTML(card.who, true)}</span>`;
      }
      return `<span class="hl ${on ? "on" : "off"}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${pin}</span>`;
    }).join("");
  }).join("");
  const n = Object.keys(sp.pins || {}).length;
  return `<div class="stop-in">
    <div class="bar"><div class="pillsw" role="radiogroup" aria-label="Show the slide"><span class="knob" aria-hidden="true"></span><button type="button" role="radio" data-side="now" aria-checked="false" tabindex="-1">Before</button><button type="button" role="radio" data-side="new" aria-checked="true">After</button></div>${outl}</div>
    <button type="button" class="stage${edited(c) ? " stale" : ""}" data-stage aria-pressed="false" aria-label="Slide ${c.slide} with every proposed change. Press to see it before the changes.">
      <img class="new" src="${IMG(sp.after)}" alt=""><img class="now" src="${IMG(sp.before)}" alt="">${pins}
    </button>
    <p class="cap"><span>Slide ${c.slide} · all ${n} changes on this slide</span>${edited(c) ? `<span class="stale-note">The picture shows Claude's wording. Yours is what goes into the deck.</span>` : ""}</p></div>`;
}
function stageHTML(c) {
  const sp = (DATA.stops || {})[c.slide];
  if (sp && c.kind !== "pick" && STOPS[stopOf(c.id)].ids.length > 1) return comboHTML(c, sp);
  if (c.kind === "reply") {
    return `<div class="stop-in"><p class="state">No change to this slide</p><div class="stage still"><img src="${IMG(c.image)}" alt="${esc(c.where)}"></div>
      <p class="cap"><span>${esc(c.where)}</span><span class="r">Claude answers ${esc(first(c.who))} instead</span></p></div>`;
  }
  if (c.kind === "pick") {
    const o = c.options.find(x => x.key === pickOf(c)), to = c.range[0][0], strip = o.strip || {};
    const isNew = n => (o.newAfter || []).includes(n);
    const from = c.range.filter(([n]) => strip[n] === "fold").map(([n]) => n);
    const L = n => { const s = strip[n] || "";
      if (s === "plus") return isNew(n) ? `New slide after slide ${n}` : from.length && n === to ? `Gets content from slide ${from.join(" and ")}` : "Gets content";
      return { "": "Kept", cut: "Hidden", fold: `Merges into slide ${to}` }[s]; };
    const outl = `<button type="button" class="cap-btn" data-outlines aria-pressed="${!outlines}">${outlines ? "Hide outlines" : "Show outlines"}</button>`;
    const box = (k, pin) => (HL[k] || []).map(([x, y, w, hh]) => `<span class="hl" style="left:${x}%;top:${y}%;width:${w}%;height:${hh}%">${pin ? `<span class="hl-who" title="${esc(PEOPLE[c.who] || "")}">${avHTML(c.who, true)}</span>` : ""}</span>`).join("");
    const z = zoom[c.id];
    if (z != null) {
      const before = c.range.find(([n]) => n === z)[1], after = (o.images || {})[z] || before, s = strip[z] || "";
      const fate = s === "fold" ? `<p class="fate">${ICON.merge}<span>Merges into slide ${to}. This slide is then hidden.</span><button type="button" class="link" data-zoom="${c.id}:${to}">See slide ${to}</button></p>`
        : s === "cut" ? `<p class="fate">${ICON.hide}<span>Hidden from the deck. Nothing carries over.</span></p>`
        : isNew(z) ? `<p class="fate">${ICON.plus}<span>New slide, added after slide ${z}.</span></p>` : `<p class="state">No change to this slide</p>`;
      const row = `<div class="thumbs" role="group" aria-label="Slides in option ${o.key}"><button type="button" class="thumb all" data-unzoom="${c.id}"><span class="tile">${ICON.grid}</span>All ${c.range.length}</button>${c.range.map(([n, img]) =>
        `<button type="button" class="thumb" data-zoom="${c.id}:${n}" aria-pressed="${n === z}"><img src="${IMG((o.images || {})[n] || img)}" alt="">Slide ${n}</button>`).join("")}</div>`;
      const cap = `<p class="cap"><span>Slide ${z} · ${esc(L(z))}</span></p>`;
      if (after === before || isNew(z)) return `<div class="stop-in has-thumbs"><div class="bar"><div class="bar-l">${fate}</div></div>
        <div class="stage still"><img src="${IMG(after)}" alt="Slide ${z}"></div>${cap}${row}</div>`;
      return `<div class="stop-in has-thumbs"><div class="bar"><div class="bar-l"><div class="pillsw" role="radiogroup" aria-label="Show the slide"><span class="knob" aria-hidden="true"></span><button type="button" role="radio" data-side="now" aria-checked="false" tabindex="-1">Before</button><button type="button" role="radio" data-side="new" aria-checked="true">After</button></div></div>${outl}</div>
        <button type="button" class="stage" data-stage aria-pressed="false" aria-label="Slide ${z} with the change. Press to see it before the change."><img class="new" src="${IMG(after)}" alt=""><img class="now" src="${IMG(before)}" alt="">${box(after, true)}</button>${cap}${row}</div>`;
    }
    return `<div class="stop-in grid6"><div class="bar"><p class="state">Option ${o.key}: ${esc(o.name)}, ${o.count}</p>${outl}</div><div class="six" aria-label="Slides under option ${o.key}">${c.range.map(([n, img]) => {
      const s = strip[n] || "", shown = (o.images || {})[n] || img;
      const tag = s === "cut" ? `<span class="tag" aria-hidden="true">${ICON.hide}Hidden</span>` : s === "fold" ? `<span class="tag" aria-hidden="true">${ICON.merge}Merges into slide ${to}</span>` : s === "plus" ? `<span class="badge" aria-hidden="true">${ICON.plus}</span>` : "";
      const inner = `<img src="${IMG(shown)}" alt="Slide ${n}${shown !== img ? " with the change" : ""}">${shown !== img && !isNew(n) ? box(shown) : ""}${tag}`;
      const pic = `<button type="button" class="pic zoom" data-zoom="${c.id}:${n}" aria-label="Slide ${n}, ${esc(L(n))}. Open it big.">${inner}</button>`;
      return `<figure class="${s}">${pic}<figcaption><b>Slide ${n}</b> · <span>${esc(L(n))}</span></figcaption></figure>`;
    }).join("")}</div></div>`;
  }
  const i = shotIdx[c.id] || 0, [b, a, cap] = c.shots[i];
  const boxes = (HL[a] || []).map(([x, y, w, h]) => `<span class="hl" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><span class="hl-who" title="${esc(PEOPLE[c.who] || "")}">${avHTML(c.who, true)}</span></span>`).join("");
  const many = c.shots.length > 1;
  const thumbs = many ? `<div class="thumbs" role="group" aria-label="Slides in this change">${c.shots.map(([, a2, cap2], j) =>
      `<button type="button" class="thumb" data-shot="${c.id}:${j}" aria-pressed="${j === i}"><img src="${IMG(a2)}" alt="">${esc(cap2)}</button>`).join("")}${c.more ? `<span class="more">${esc(c.more)}</span>` : ""}</div>` : "";
  return `<div class="stop-in${many ? " has-thumbs" : ""}">
    <div class="bar"><div class="pillsw" role="radiogroup" aria-label="Show the slide"><span class="knob" aria-hidden="true"></span><button type="button" role="radio" data-side="now" aria-checked="false" tabindex="-1">Before</button><button type="button" role="radio" data-side="new" aria-checked="true">After</button></div><button type="button" class="cap-btn" data-outlines aria-pressed="${!outlines}">${outlines ? "Hide outlines" : "Show outlines"}</button></div>
    <button type="button" class="stage${edited(c) ? " stale" : ""}" data-stage aria-pressed="false" aria-label="${esc(cap)} with ${edited(c) ? "Claude's wording, not yours" : "the change"}. Press to see it before the change.">
      <img class="new" src="${IMG(a)}" alt=""><img class="now" src="${IMG(b)}" alt="">${boxes}
    </button>
    <p class="cap"><span>${esc(cap)}</span>${edited(c) ? `<span class="stale-note">The picture shows Claude's wording. Yours is what goes into the deck.</span>` : ""}</p>${thumbs}</div>`;
}
function renderStop(i) { const el = document.getElementById("st" + i); if (el) el.innerHTML = stageHTML(activeOf(i)); }
function stripHTML() {
  return STOPS.map((s, i) => {
    const cs = s.ids.map(byId), c = cs[0];
    const img = c.kind === "reply" ? c.image : c.kind === "pick" ? c.range[0][1] : c.shots[0][1];

/* ---------- live: each decision goes to Claude the moment you make it ---------- */
/* The server records what you decide (acts) and hands back how Claude is getting on (progress).
   Every open copy of this page polls, so two windows never disagree. */
let OFF = false, OFFWHY = "", SENT = false, inflight = 0;
const LATER = {};                 // card id -> later replies, from the server
const UNSENT = {};                // card id -> why its last decision didn't reach the server
async function send(c, body) {
  inflight++;

  try {
    const r = await fetch("api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ id: c.id }, body)) });
    const res = await r.json().catch(() => ({}));
    if (r.ok) n = res.n; else why = res.error || `the review server said ${r.status}`;
  } catch (e) { why = "Claude's review server didn't answer. Is it still running?"; }
  inflight--;
  if (why == null) { OFF = false; SENT = true; delete UNSENT[c.id]; poll(); return n; }
  /* Nothing was recorded, so nothing will happen: put the card back the way the server has it, and say why */
  UNSENT[c.id] = why;
  if (!/didn't answer/.test(why)) OFF = false; else OFF = true;
  lastSeen = "";
  if (LASTST) fromServer(LASTST);
  if (cur >= 0 && stopOf(c.id) === cur && !mode && !editing) show(c.id);   // back to the comment that didn't go, if it's on this slide

  return null;
}
async function poll() {
  if (inflight) return;           // a decision is on its way; don't let an older answer undo it on screen
  let why = "";
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    if (!r.ok) { why = (await r.json().catch(() => ({}))).error || ""; throw new Error(String(r.status)); }
    const st = await r.json();
    if (OFF) { OFF = false; OFFWHY = ""; keepFocus(refresh); }
    if (!inflight) fromServer(st);
  } catch (e) {
    /* say it once, and again only if the reason changes (a damaged acts.json says which file) */
    if (!OFF || why !== OFFWHY) { OFF = true; OFFWHY = why; keepFocus(refresh); }
  }
}
/* Re-render without losing your place in a text field you're typing in */

}
let lastSeen = "";

function fromServer(st) {

  let reload = false;

    const a = A[c.id], mine = a && P[c.id] && P[c.id].n === a.n ? P[c.id] : null, old = S.cards[c.id];
    let d;
    if (!a || a.act === "reopen") d = null;
    else if (a.act === "skip") d = { st: "skip" };
    else if (a.act === "close") d = { st: "closed" };
    else if (a.act === "approve") d = mine ? { st: mine.st, t: a.n, why: mine.why } : { st: "queued", t: a.n };
    else if (a.act === "back") {

      if (d.revised && (!old || old.revised !== a.n)) reload = true;   // Claude redid it: fetch the new preview and wording
    }
    else if (a.act === "undo") d = !mine ? { st: "undo", t: a.n } : mine.st === "open" ? null : mine.st === "failed" ? { st: "in", t: a.n, why: `Couldn't take it out: ${mine.why || "Claude will say why."}` } : { st: mine.st, t: a.n, why: mine.why };
    if (d) S.cards[c.id] = d; else delete S.cards[c.id];

    const orphan = !drafting.has(k) && lastDraft[k] === x.n && (x.for === "later" ? !(laterDraft.get(c.id) || "").trim() : isOpen(c) && !hasReply(c));

/* ---------- demo: with no server, Claude's side is acted out on a timer ---------- */
let busy = false, gen = 0;
function refresh() { if (mode || editing) { document.getElementById("sideFoot").innerHTML = footHTML(); renderNav(); } else renderSide(); }
function tick() {
  if (busy || LIVE) return;
  const q = CARDS.filter(c => ["queued", "back", "undo"].includes(stOf(c))).sort((a, b) => S.cards[a.id].t - S.cards[b.id].t)[0];
  if (!q) return;
  busy = true;
  const g = gen, d = S.cards[q.id];
  const later = (ms, f) => setTimeout(() => { if (g === gen) f(); }, ms);
  const set = s => { S.cards[q.id] = Object.assign({}, S.cards[q.id], { st: s }); save(); refresh(); };
  const done = () => { busy = false; tick(); };
  if (d.st === "queued" && q.kind === "reply" && !hasReply(q)) { set("closed"); done(); }
  else if (d.st === "queued" && q.kind === "reply") { set("posting"); later(1600, () => { set("posted"); done(); }); }
  else if (d.st === "queued") { set("applying"); later(3200, () => { if (hasReply(q)) { set("posting"); later(1400, () => { set("in"); done(); }); } else { set("in"); done(); } }); }
  else if (d.st === "back") { set("revising"); later(4000, () => { S.cards[q.id] = { st: "open", revised: true, note: d.note }; save(); refresh(); done(); }); }
  else if (d.st === "undo") {
    const reopen = () => { delete S.cards[q.id]; save(); refresh(); done(); };
    const down = () => { set("unposting"); later(1500, reopen); };
    if (d.from === "posted") down();
    else { set("undoing"); later(2200, () => hasReply(q) ? down() : reopen()); }
  }
}
/* After a decision, move to the next comment that still needs one: on this slide first, then the slides after it */
function advance() {
  if (mode || editing) return;
  const here = STOPS[cur].ids.find(id => isOpen(byId(id)));
  if (here) { if (activeOf(cur).id !== here) show(here); return; }
  for (let k = 1; k < STOPS.length; k++) {
    const i = (cur + k) % STOPS.length, id = STOPS[i].ids.find(x => isOpen(byId(x)));
    if (id) { if (activeOf(i).id !== id) { active[i] = id; renderStop(i); } go(i); return; }
  }
}
init().then(tick);

document.getElementById("prev").addEventListener("click", () => go(cur - 1));
document.getElementById("next").addEventListener("click", () => go(cur + 1));
document.addEventListener("keydown", e => {

/* Click the slide to see it as it is now; click again for the change. Space or Enter does the same from the keyboard. */
function setNow(s, on) {

/* The Before / After pill: tap a side, tap the pill to flip, or drag the knob and let go */
let pd = null;

    }
    else if (act === "delreply") { setReply(c, ""); genText.delete(c.id); replyOpen.delete(c.id); save(); renderSide(); }
    else if (act === "openlater") { laterOpen.add(c.id); renderSide(); focusLater(c); }
    else if (act === "closelater") { laterDraft.delete(c.id); laterOpen.delete(c.id); renderSide(); }
    else if (act === "addreply") { replyOpen.add(c.id); renderSide(); focusReply(c); }
    else if (act === "revert") { if (!isOpen(c)) return; if (c.kind === "reply") delete S.replies[c.id]; else { delete S.edits[c.id]; renderStop(stopOf(c.id)); } save(); renderSide(); }
    return;
  }
  /* Clicking anywhere else on a comment (in a slide with several) puts its change on the big slide */
  const sel = e.target.closest("[data-sel]");
  if (sel && !e.target.closest("button, a, summary, textarea") && activeOf(cur).id !== +sel.dataset.sel) { show(sel.dataset.sel); return; }
  if (e.target.id === "reset") {
    if (LIVE) fetch("api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {});
    S = fresh(); dropStale(); save(); mode = null; gen++; busy = false;
    Object.keys(UNSENT).forEach(k => delete UNSENT[k]);
    [active, shotIdx, zoom, LATER].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    [replyOpen, genText, laterDraft, laterOpen, whyOpened, drafting].forEach(s => s.clear()); editing = null; lastSeen = "";
    STOPS.forEach((_, i) => renderStop(i)); scroller.scrollTop = 0; markSeen(0); renderSide();
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.later != null) {
    const c = byId(e.target.dataset.later), v = e.target.value, box = e.target.closest(".composer");
    laterDraft.set(c.id, v);
    if (box && box.classList.contains("empty") === !!v.trim()) { const pos = e.target.selectionStart; renderSide(); const t = document.querySelector(`textarea[data-later="${c.id}"]`); if (t) { t.focus(); t.setSelectionRange(pos, pos); } }
    return;
  }
  const lv = e.target.dataset && e.target.dataset.live;
  if (lv) {
    const [id, j] = lv.split(":"), c = byId(id), v = e.target.value;
    if (j === "r") { setReply(c, v); const del = !!v.trim(), box = e.target.closest(".msg-body"); if (box && (!!box.querySelector(".icon-btn") !== del || !!box.querySelector(".gen") === del)) { const pos = e.target.selectionStart; renderSide(); const t = document.querySelector(`textarea[data-live="${c.id}:r"]`); if (t) { t.focus(); t.setSelectionRange(pos, pos); } } }
    else {
      const was = edited(c), arr = c.edit.map((x, k) => lineText(c, k)); arr[+j] = v;
      if (arr.every((x, k) => x === c.edit[k].after)) delete S.edits[c.id]; else { S.edits[c.id] = arr; noteBase(c); }
      /* The moment your wording differs from Claude's (or goes back to it), say so: "Your edit" in the panel, and a note
         on the slide that the picture still shows Claude's version. Only redraw on that switch, not on every key. */
      if (edited(c) !== was) { save(); keepFocus(() => { const i = stopOf(c.id); if (activeOf(i).id === c.id) renderStop(i); renderSide(); }); return; }
    }
    save();
  }
});

/* Reply boxes grow with their text in every browser (field-sizing isn't everywhere yet), so there's never an inner scrollbar */
function fit(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + (t.offsetHeight - t.clientHeight) + "px"; }   /* add back only the border it actually has */
document.addEventListener("input", e => { if (e.target.matches && e.target.matches("textarea.field")) fit(e.target); });
/* "Drafted by Claude" drops off the moment you change the wording, and comes back if you type it back to Claude's */
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.live; if (!k || !k.endsWith(":r")) return; const sub = e.target.closest(".msg-body")?.querySelector(".msg-sub"); if (sub) sub.hidden = !byClaude(byId(k.split(":")[0])); });
const fitAll = () => document.querySelectorAll("#sideBody textarea.field").forEach(fit);
new MutationObserver(fitAll).observe(document.getElementById("sideBody"), { childList: true, subtree: true });
new ResizeObserver(fitAll).observe(document.getElementById("sideBody"));   // the panel's width settles after fonts load
if (document.fonts) document.fonts.ready.then(fitAll);
</script>
